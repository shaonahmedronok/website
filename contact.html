<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact — Shaon Ahmed Ronok">
<title>Connect | Shaon</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Sole Background Palette */
  --bg: #242424;
  --surf: #242424;

  /* Universal Static Text & Line Colors */
  --tx: #fbf1c7;
  --bd: #fbf1c7;

  /* Universal Interactive Accent Colors */
  --ac: #7daea3;

  /* Typography */
  --fd: 'JetBrains Mono', monospace;
  --fb: 'JetBrains Mono', monospace;
  --fm: 'JetBrains Mono', monospace;

  /* Physics & Shadows */
  --sh-card: 0 4px 20px rgba(125, 174, 163, 0.15);
  --sh-glow: 0 8px 24px rgba(125, 174, 163, 0.25);
  --r: 6px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:17.5px;overflow-x:hidden;width:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;width:100%;-webkit-font-smoothing:antialiased}

::selection{background:rgba(125, 174, 163, 0.3);color:var(--bg)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}

#prog{position:fixed;top:0;left:0;z-index:300;height:2px;background:var(--ac);width:0;transition:width .1s linear}
#nav{position:fixed;top:0;left:0;right:0;z-index:200;transition:background .4s,box-shadow .4s;width:100%;background:rgba(36,36,36,.97);backdrop-filter:blur(20px) saturate(1.2)}
#nav.sc{box-shadow:0 1px 0 var(--bd)}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:1400px;margin:0 auto;padding:.6rem 2.3rem .5rem;gap:.3rem;width:100%}
.nlogo{font-family:var(--fd);font-size:1.4rem;font-weight:900;letter-spacing:-.02em;color:var(--tx)}
.nlinks{display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem;list-style:none}
.nlinks a{font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--tx);padding:.32rem .65rem;border-radius:var(--r);transition:all .2s cubic-bezier(0.4, 0, 0.2, 1)}
.nlinks a:hover{color:var(--ac);background:transparent}
.nlinks a.act{color:var(--bg);background:var(--ac);font-weight:700;box-shadow:var(--sh-glow)}

.w{width:100%;max-width:1400px;margin:0 auto;padding:0 2.3rem;position:relative;z-index:1}
section{padding:2.5rem 0;position:relative;z-index:1}

.sl{font-family:var(--fm);font-size:.68rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin-bottom:.6rem;opacity:.9;display:flex;align-items:center;gap:.55rem}
.sl::after{content:'';flex:0 0 22px;height:1px;background:var(--ac);opacity:.5}
.stitle{font-family:var(--fd);font-size:clamp(2rem,4vw,3.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:1.8rem;color:var(--tx)}

#contact-page{padding-top:7.5rem;min-height:75vh}
.clinks{display:flex;flex-direction:column;gap:.9rem;max-width:620px}
.cl{display:flex;align-items:center;gap:.9rem;padding:.95rem 1.15rem;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);transition:all .2s ease;color:var(--tx)}
.cl:hover{border-color:var(--ac);transform:translateX(4px);box-shadow:var(--sh-card)}
.cl img{width:21px;height:21px;object-fit:contain}
.clp{font-size:.72rem;color:var(--ac);font-family:var(--fm);letter-spacing:.08em;text-transform:uppercase}
.clh{font-size:.88rem;font-weight:500;margin-top:.1rem;color:var(--tx)}

footer{background:var(--bg);border-top:1px solid var(--bd);padding:1.9rem 0}
.fc{font-family:var(--fm);font-size:.7rem;color:var(--tx)}

#st{position:fixed;bottom:2rem;right:2rem;z-index:200;width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-glow);opacity:0;transform:translateY(10px);transition:all .35s cubic-bezier(.22,1,.36,1)}
#st.vi{opacity:1;transform:none}
#st:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(125, 174, 163, 0.4)}

@media(max-width:900px){
  html,body{font-size:16px;width:100%;overflow-x:hidden}
}
@media(max-width:560px){
  .w{padding:0 1.2rem}
  .nlogo{font-size:1.1rem}
  .nlinks a{font-size:.68rem;padding:.28rem .5rem}
}
</style>
</head>
<body>

<div id="prog"></div>

<div id="nav">
  <div class="ni">
    <a class="nlogo" href="index.html">Shaon Ahmed Ronok</a>
    <ul class="nlinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="connect.html" class="act">Connect</a></li>
    </ul>
  </div>
</div>

<section id="contact-page">
  <div class="w">
    <p class="sl">Get in touch</p>
    <h2 class="stitle">Digital Footprints</h2>
  
    <div class="clinks">
      <a href="https://github.com/shaonahmedronok" class="cl" target="_blank">
        <img src="/icons/GitHub_Invertocat_White.png" alt="GitHub">
        <div><p class="clp">GitHub</p><p class="clh">shaonahmedronok</p></div>
      </a>
     
      <a href="https://discord.com/users/1526192711911211128" class="cl" target="_blank">
        <img src="/icons/Discord-Symbol-Blurple.png" alt="Discord">
        <div><p class="clp">Discord</p><p class="clh">pupilusr</p></div>
      </a>
      
      <a href="https://linkedin.com/shaonahmedronok" class="cl" target="_blank">
        <img src="/icons/LI-In-Bug.png" alt="LinkedIn">
        <div><p class="clp">LinkedIn</p><p class="clh">shaonahmedronok</p></div>
      </a>
     
      <a href="https://facebook.com/shaonahmedronok" class="cl" target="_blank">
        <img src="/icons/Facebook_Logo_Primary.png" alt="Facebook">
        <div><p class="clp">Facebook</p><p class="clh">shaonahmedronok</p></div>
      </a>
     
      <a href="https://www.youtube.com/@shaonahmedronok" class="cl" target="_blank">
        <img src="/icons/yt_icon_red_digital.png" alt="YouTube">
        <div><p class="clp">YouTube</p><p class="clh">shaonahmedronok</p></div>
      </a>
    </div>
  </div>
</section>



<button id="st" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script>
const nav = document.getElementById('nav');
const _st = document.getElementById('st');
const _prog = document.getElementById('prog');
let ticking = false;
window.addEventListener('scroll', () => {
  if(!ticking){
    requestAnimationFrame(() => {
      const sy = window.scrollY;
      const sh = document.body.scrollHeight - window.innerHeight;
      nav.classList.toggle('sc', sy > 40);
      _st.classList.toggle('vi', sy > 100);
      _prog.style.width = (sy / (sh || 1) * 100) + '%';
      ticking = false;
    });
    ticking = true;
  }
}, {passive: true});
</script>
</body>
</html>
