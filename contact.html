<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact — Shaon Ahmed Ronok">
<title>Contact | Shaon</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#242424;--surf:#3c3836;--surf2:#504945;
--tx:#ebdbb2;--tx2:#d5c4a1;--mu:#d5c4a1;--mu2:#665c54;
--bd:#504945;--bd2:#665c54;
--yellow:#fabd2f;--orange:#fe8019;--green:#b8bb26;
--cyan:#8ec07c;--blue:#7daea3;--magenta:#e089a1;--red:#fb4934;
--ac:var(--yellow);--ac2:var(--orange);--ac3:var(--green);
--ac4:var(--blue);--ac5:var(--cyan);--ac6:var(--magenta);--ac7:var(--red);
--gd:var(--yellow);--gd2:var(--orange);--hv:#3c3836;
--fd:'JetBrains Mono',monospace;--fb:'JetBrains Mono',monospace;--fm:'JetBrains Mono',monospace;
--bg2:#242424;
--sh0:0 1px 6px rgba(250,189,47,.07);--sh1:0 4px 20px rgba(250,189,47,.12);--sh2:0 12px 56px rgba(250,189,47,.18);--r:4px}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth;font-size:17.5px;overflow-x:hidden;width:100%;}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.6;overflow-x:hidden;width:100%;-webkit-font-smoothing:antialiased;}
::selection{background:rgba(250,189,47,.25);color:#242424}
a{color:inherit;text-decoration:none}

#nav{position:fixed;top:0;left:0;right:0;z-index:200;transition:background .4s,box-shadow .4s;width:100%;}
#nav.sc{background:rgba(36,36,36,.95);backdrop-filter:blur(20px) saturate(1.2);box-shadow:0 1px 0 var(--bd)}
.ni{display:flex;align-items:center;justify-content:space-between;max-width:1160px;margin:0 auto;padding:.9rem 2rem;transition:padding .3s;width:100%;}
#nav.sc .ni{padding:.7rem 2rem}
.nlogo{font-family:var(--fd);font-size:1.1rem;font-weight:900;letter-spacing:-.02em;color:var(--magenta)}
.nlinks{display:flex;gap:.15rem;list-style:none}
.nlinks a{font-size:.8rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);padding:.42rem .75rem;border-radius:6px;transition:color .2s,background .2s}
.nlinks a:hover,.nlinks a.act{color:var(--ac);background:var(--hv)}

.ham{display:none;flex-direction:column;gap:4px;background:none;border:none;padding:.4rem}
.ham span{display:block;width:22px;height:2px;background:var(--tx);border-radius:2px;transition:all .3s}

.w{width:100%;max-width:1400px;margin:0 auto;padding:0 2.3rem;position:relative;z-index:1}

section{padding:1.2rem 0;position:relative;z-index:1}
hr.dv{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--bd2) 40%,var(--bd2) 60%,transparent);margin:0}
.sl{font-family:var(--fm);font-size:.68rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin-bottom:.6rem;opacity:.85;display:flex;align-items:center;gap:.55rem}
.sl::after{content:'';flex:0 0 22px;height:1px;background:var(--blue);opacity:.5}
.stitle{font-family:var(--fd);font-size:clamp(1.5rem,3vw,2.2rem);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:.5rem}
.ssub{font-size:.9rem;color:var(--mu);line-height:1.8;margin-bottom:2.5rem}

.clinks{display:flex;flex-direction:column;gap:.9rem;max-width:620px}
.cl{display:flex;align-items:center;gap:.9rem;padding:.95rem 1.15rem;background:rgba(250,189,47,.04);border:1px solid rgba(250,189,47,.09);border-radius:10px;transition:all .2s;color:var(--tx)}
.cl:hover{background:rgba(251,241,199,.09);border-color:rgba(250,189,47,.28);transform:translateX(4px)}
.cl img{width:21px;height:21px;object-fit:contain;filter:brightness(0) invert(1);opacity:.7}
.clp{font-size:.72rem;color:rgba(251,241,199,.38);font-family:var(--fm);letter-spacing:.08em;text-transform:uppercase}
.clh{font-size:.88rem;font-weight:500;margin-top:.1rem}

footer{background:#242424;border-top:1px solid var(--bd);padding:1.9rem 0;margin-top:3rem}
.fc{font-family:var(--fm);font-size:.7rem;color:var(--mu)}

@media(max-width:900px){
  html,body{font-size:16px;width:100%;overflow-x:hidden}
  .ni{padding:.7rem 1.5rem}
  .nlinks{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surf);border-bottom:1px solid var(--bd);flex-direction:column;padding:1rem;gap:.2rem}
  .nlinks.op{display:flex}
  .ham{display:flex}
}

@media(max-width:560px){
  .w{padding:0 1.2rem}
}
</style>
</head>
<body>

<div id="nav">
  <div class="ni">
    <a class="nlogo" href="index.html">@shaonsays</a>
    <ul class="nlinks" id="nl">
      <li><a href="index.html">Home</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nright">
      <button class="ham" onclick="document.getElementById('nl').classList.toggle('op')"><span></span><span></span><span></span></button>
    </div>
  </div>
</div>

<br><br><br><br>

<section>
  <div class="w">
    <p class="sl">Get in touch</p>
    <h2 class="stitle">Digital Footprints</h2>
    <p class="ssub">Reach me through any of the platforms below.</p>
    <div class="clinks">

      <a href="https://github.com/shaonahmedronok" class="cl" target="_blank">
        <img src="/icons/GitHub_Invertocat_Black.svg" alt="GitHub">
        <div><p class="clp">GitHub</p><p class="clh">shaonahmedronok</p></div>
      </a>

      <a href="https://www.youtube.com/@shaonsays" class="cl" target="_blank">
        <img src="/icons/yt_icon_red_digital.png" alt="YouTube">
        <div><p class="clp">YouTube</p><p class="clh">@shaonsays</p></div>
      </a>

    </div>
  </div>
</section>

<footer>
  <div class="w">
    <p class="fc">Shaon Ahmed Ronok</p>
  </div>
</footer>

<script>
const nav = document.getElementById('nav');
let ticking = false;
window.addEventListener('scroll', () => {
  if(!ticking){
    requestAnimationFrame(() => {
      nav.classList.toggle('sc', window.scrollY > 40);
      ticking = false;
    });
    ticking = true;
  }
}, {passive: true});

document.addEventListener('click', e => {
  const nl = document.getElementById('nl');
  const ham = document.querySelector('.ham');
  if(nl && nl.classList.contains('op') && !nl.contains(e.target) && e.target !== ham && !ham.contains(e.target)){
    nl.classList.remove('op');
  }
});
</script>
</body>
</html>
